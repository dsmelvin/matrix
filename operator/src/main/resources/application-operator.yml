spring:
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
    openai:
      timeout: 1800s
      base-url: ${INFERENCE_BASE_URL:}
      api-key: ${INFERENCE_API_KEY:}
      chat:
        model: ${INFERENCE_MODEL:}

agent:
  tools: ${AGENT_TOOLS:}
  mcp-servers-configuration: ${MCP_SERVERS_CONFIGURATION:}
  chat-model:
    max-completion-tokens: ${AGENT_MAX_COMPLETION_TOKEN:}
  message-window-chat-memory:
    max-messages: ${AGENT_MAX_MESSAGE:500}
  prompt:
    system: ${AGENT_PROMPT_SYSTEM:}
  path:
    memory: ${AGENT_PATH_MEMORY:}
  paths:
    agents: ${AGENT_PATHS_AGENTS:}
    skills: ${AGENT_PATHS_SKILLS:}
